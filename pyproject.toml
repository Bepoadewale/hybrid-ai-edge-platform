[project]
name="hybrid-ai-edge-platform"
version="0.2.0"
requires-python=">=3.12"
dependencies=[
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "uvicorn>=0.34,<1",
]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath=["control-plane/src"]
[tool.ruff]
line-length=100
target-version="py312"
[tool.setuptools]
package-dir={""="control-plane/src"}
[tool.setuptools.packages.find]
where=["control-plane/src"]
